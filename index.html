<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Plastic Presentation</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
</head>
<body>

<div id="app-bg"></div>

<div id="physics-layer">
  <canvas id="physics"></canvas>
</div>

<div id="timer"></div>

<div id="slides">

  <!-- SLIDE 1 -->

  <section class="slide active" id="slide1">

    <div class="legend top-right">
      <div class="legend-ball"></div>
      <div class="legend-text">= 13 tonnen</div>
    </div>

    <div class="title">
      Plastik<br>Welt
    </div>

  </section>

  <!-- SLIDE 2 -->

  <section class="slide" id="slide2">

    <div class="left-title">
      Plastikproduktion<br>weltweit – Live
    </div>

    <img
      class="vw-logo"
      src="./assets/svg/vw.svg"
      alt="VW"
    />

  </section>

  <!-- SLIDE 3 -->

  <section class="slide" id="slide3">

    <div class="left-title">
      Plastikproduktion<br>weltweit – Live
    </div>

    <div class="legend top-right">
      <div class="legend-ball"></div>
      <div class="legend-text">= 13 tonnen</div>
    </div>

<div class="ton-display">
  <div id="bigTonCounter">0</div>
  <div class="ton-unit">tonnen</div>
</div>

  </section>

  <!-- SLIDE 4 -->

<section class="slide" id="slide4">

  <div class="left-title">
    Plastikproduktion<br>weltweit – Live
  </div>

  <div class="wagon-counter">

    <div id="wagonCounter" class="wagon-number">
      0
    </div>

    <div class="wagon-unit">
      Stk.
    </div>

  </div>

  <div class="ton-display">
    <div id="bigTonCounter4">0</div>
    <div class="ton-unit">tonnen</div>
  </div>

  <div class="railroad" id="railroad"></div>

  <div class="train">

  <img
    id="trainImage"
    src="./assets/svg/wagen.svg"
    alt=""
  >

</div>

</section>

</div>

<script src="app.js"></script>

</body>
</html>
