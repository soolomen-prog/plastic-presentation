<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Plastic Presentation</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
</head>
<body>

  <div id="app-bg"></div>

  <div id="physics-layer">
    <canvas id="physics"></canvas>
  </div>

  <div id="timer"></div>

  <div id="slides">

    <section class="slide active" id="slide1">
      <div class="title">
        Plastik<br>Welt
      </div>
    </section>

    <section class="slide" id="slide2">
      <div class="left-title">
        Plastikproduktion<br>weltweit – Live
      </div>

      <div class="scale">
        <div class="scale-line"></div>

        <div class="marker" id="marker">
          <div class="tick"></div>
          <div class="ton-count" id="tonCount">0 t</div>
        </div>
      </div>

      <div class="legend">
        <div class="legend-ball"></div>
        <div class="legend-text">= 13 tonnen</div>
      </div>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
